name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Type-check
        run: npx -y typescript tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit (fail on moderate+)
        run: |
          npm audit --audit-level=moderate || (echo "Audit found issues" && exit 1)

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
